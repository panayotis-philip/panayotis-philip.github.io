name: Compile CV

on:
  push:
    branches: [main]
    paths:
      - "cv-source/main.tex"
      - ".github/workflows/compile-cv.yml"

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install --yes texlive-latex-extra

      - name: Compile CV
        run: |
          mkdir -p cv-build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=cv-build cv-source/main.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=cv-build cv-source/main.tex
          cp cv-build/main.pdf files/panayotis-philip-papavassilopoulos-cv.pdf

      - name: Commit generated PDF
        run: |
          if git diff --quiet -- files/panayotis-philip-papavassilopoulos-cv.pdf; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add files/panayotis-philip-papavassilopoulos-cv.pdf
          git commit -m "Update website CV PDF"
          git push
